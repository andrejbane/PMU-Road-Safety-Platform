spring.application.name=pmu

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pmu}

# Required: provide a Base64-encoded key of at least 32 random bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Optional bootstrap accounts. Set both values for an account or leave both unset.
bootstrap.moderator.email=${BOOTSTRAP_MODERATOR_EMAIL:}
bootstrap.moderator.password=${BOOTSTRAP_MODERATOR_PASSWORD:}
bootstrap.report-moderator.email=${BOOTSTRAP_REPORT_MODERATOR_EMAIL:}
bootstrap.report-moderator.password=${BOOTSTRAP_REPORT_MODERATOR_PASSWORD:}
